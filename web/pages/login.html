<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Login</title>
    <link rel='stylesheet' href='../../web/css/pages/login.css'>
</head>
<body>
    <section class="containerFather">
        <div class="card loginActive">
            <div class="lefth">
                <div class="formLogin">
                    <h2>Login</h2>
                    <form>
                        <input type="email" placeholder="E-mail"> 
                        <input type="password" placeholder="Senha">
                        <button type="submit">Entrar</button>
                    </form>
                </div>
                 <div class="fcLogin">
                    <h2>Já Tem <br>Uma Conta?</h2>
                    <p>Faça seu login e acompanhe os seus hábitos e atividades com gráficos e dashboards</p>
                    <button>Faça login</button>
                </div>
            </div>
            <div class="rigth">
                <div class="formCadastro">
                    <h2>Cadastro</h2>
                    <form>
                        <input type="text" placeholder="Nome">
                        <input type="email" placeholder="E-mail">
                        <input type="password" placeholder="Senha">
                        <input type="password" placeholder="Confirme sua senha">
                        <button type="submit">Cadastrar-se</button>
                    </form>
                </div>
                <div class="fcCd">
                    <h2>Não tem<br> uma conta?</h2>
                    <p>Crie já sua conta e acompanhe seus habitos e suas atividades com gráficos e dashboards</p>
                    <button>Cadastrar-se</button>
                </div>
            </div>
        </div>
    </section>
    
    <script src="../../web/js/pages/login.js"></script>
</body>
</html>
