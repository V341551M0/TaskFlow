<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080">
    <title>Habitos</title>
    <script src="../../web/config.js"></script>
    <link rel="stylesheet" href="../../web/css/pages/layoutHB.css">
    <script src="../../web/js/pages/habitTask.js" defer></script>
</head>
<body>
    <div class="dashboard-container">

        <div class="container-buttons">
            <!-- Botões de Navegação -->
            <nav class="nav-buttons">
                <a href="../index.html">
                    <button type="button">Voltar para Página Inicial</button>
                </a>
                <button type="button" class="logout-btn">Sair</button>
            </nav>
            <!--Botões de Criação-->
            <nav class="new-class-button">
                <button>Criar Novo Hábito</button>
            </nav>
        </div>
        
        <!-- Modal (janela de criação) -->
        <div id="modal-task" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Criar Hábito</h2>
                <p class="modal-subtitle">Cadastre um novo hábito e acompanhe sua evolução ao longo do ano.</p>
    
                <form id="form-task">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required placeholder="Ex: Beber 2L de água">

                    <label for="data">Data:</label>
                    <input type="date" id="data">

                    <label for="diario">Todos os dias?</label>
                    <input type="checkbox" id="diario">

                    <label for="vezes-dia">Vezes ao dia:</label>
                    <input type="number" id="vezes-dia" min="1" value="1">

                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>

        <section class="metrics-grid">
        <article class="card">
            <h3>Habitos</h3>
            <p class="metric-value" id="habit-count">0/-</p>
        </article>
        <article class="card">
            <h3>Sequencia Atual</h3>
            <p class="metric-value">0/-</p>
        </article>
        <article class="card">
            <h3>Maior Sequencua</h3>
            <p class="metric-value">0/-</p>
        </article>
    </section>

    <section class="card list-section-card">
        <div class="card-header">
            <h2>Lista de Hábitos</h2>
        </div>
        <div id="habit-list" class="items-list"></div>
    </section>

    <!-- Painel do Mapa de Calor -->
    <section class="card heatmap-card">
      <h2>Atividade no Último Ano</h2>

      <!-- Container do Mapa de Calor -->
      <div class="heatmap-wrapper">

        <!-- Rótulos dos Dias da Semana -->
        <ul class="weekdays">
          <li>Dom</li>
          <li>Seg</li>
          <li>Ter</li>
          <li>Qua</li>
          <li>Qui</li>
          <li>Sex</li>
          <li>Sab</li>
        </ul>

        <!-- Calendário -->
        <div class="calendar">

          <!-- Dias (semanas em colunas x 7 dias) -->
          <div id="heatmap"></div>

        </div>

      </div>
    </section>

    <script src="../js/app.js"></script>
</body>
</html>
