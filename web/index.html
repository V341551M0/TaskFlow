<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Dashboard</title>
    <!-- Conexão com o arquivo CSS externo -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Cabeçalho do Painel -->
        <header class="header">
            <h1>Painel de Desempenho</h1>
            <p>Acompanhe a evolução de hábitos e tarefas através de gráficos</p>
        </header>

        <!-- Navegação de Páginas -->
        <nav class="nav-buttons">
            <button>Tarefas</button>
            <button>Tarefas Recorrentes</button>
            <button>Hábitos</button>
        </nav>

        <!-- Grade Principal de Gráficos -->
        <section class="charts-grid">
            
            <!-- Gráfico 1: Barras (Desempenho Semanal) -->
            <article class="card chart-card">
                <div class="chart-header">
                    <h3>Desempenho Semanal</h3>
                    <span class="metric-value" id="weekly-total">--</span>
                </div>
                <div class="chart-container">
                    <svg class="bar-chart-svg" viewBox="0 0 300 150">
                        <!-- Linhas de Grade de Fundo -->
                        <line class="chart-grid-line" x1="0" y1="30" x2="300" y2="30" />
                        <line class="chart-grid-line" x1="0" y1="75" x2="300" y2="75" />
                        <line class="chart-grid-line" x1="0" y1="120" x2="300" y2="120" />
                        
                        <!-- Barras dos Dias da Semana (Sem alturas estáticas) -->
                        <rect class="chart-bar" x="20" y="120" width="20" height="0" />
                        <rect class="chart-bar" x="60" y="120" width="20" height="0" />
                        <rect class="chart-bar" x="100" y="120" width="20" height="0" />
                        <rect class="chart-bar" x="140" y="120" width="20" height="0" />
                        <rect class="chart-bar" x="180" y="120" width="20" height="0" />
                        <rect class="chart-bar" x="220" y="120" width="20" height="0" />
                        <rect class="chart-bar" x="260" y="120" width="20" height="0" />
                    </svg>
                    <!-- Rótulos dos Dias da Semana -->
                    <div class="chart-labels">
                        <span>Seg</span>
                        <span>Ter</span>
                        <span>Qua</span>
                        <span>Qui</span>
                        <span>Sex</span>
                        <span>Sáb</span>
                        <span>Dom</span>
                    </div>
                </div>
            </article>

            <!-- Gráfico 2: Linha (Evolução Mensal) -->
            <article class="card chart-card">
                <div class="chart-header">
                    <h3>Evolução Mensal</h3>
                    <span class="metric-value" id="monthly-rate">--%</span>
                </div>
                <div class="chart-container">
                    <svg class="line-chart-svg" viewBox="0 0 300 150">
                        <!-- Linhas de Grade de Fundo -->
                        <line class="chart-grid-line" x1="0" y1="30" x2="300" y2="30" />
                        <line class="chart-grid-line" x1="0" y1="75" x2="300" y2="75" />
                        <line class="chart-grid-line" x1="0" y1="120" x2="300" y2="120" />

                        <!-- Linha do Gráfico (Preenchida via JS futuramente) -->
                        <path class="chart-line" d="M 0 120" />
                    </svg>
                </div>
            </article>

            <!-- Gráfico 3: Rosca/Donut (Distribuição por Categoria) -->
            <article class="card chart-card">
                <div class="chart-header">
                    <h3>Distribuição de Conclusão</h3>
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container donut-container">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>

        </section>

        <!-- Seção de Histórico / Resumo -->
        <section class="card history-summary-card">
            <h2>Resumo das Atividades</h2>
            <div id="activity-summary-container">
                <!-- Conteúdo preenchido dinamicamente via JS -->
            </div>
        </section>
    </div>

    <!-- Script principal -->
    <script src="js/app.js"></script>
</body>
</html>
